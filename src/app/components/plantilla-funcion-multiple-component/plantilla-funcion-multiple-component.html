<h1 style="color:blue">Plantilla función múltiple</h1>
<form #plantillaform="ngForm">
    <label>Seleccione una función</label>
    <select name="selectfunciones" #selectfunciones class="form-control" multiple size="5">
        @for (fun of funciones; track fun){
        <option>{{fun}}</option>
        }
    </select>
    <button (click)="mostrarPlantilla()">Mostrar plantilla</button>
</form>
<table class="table table-primary">
    <thead>
        <tr>
            <th>Apellido</th>
            <th>Funcion</th>
            <th>Turno</th>
            <th>Salario</th>
        </tr>
    </thead>
    @for (person of personas; track person){
    <tr>
        <td>{{person.apellido}}</td>
        <td>{{person.funcion}}</td>
        <td>{{person.turno}}</td>
        <td>{{person.salario}}</td>
    </tr>
    }
</table>
